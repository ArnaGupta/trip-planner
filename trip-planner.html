<!DOCTYPE html>
<html>
<head>
  <title>Trip Budget Planner</title>
</head>
<body>
  <h1 id="title">Trip Budget Planner</h1>
  <p id="trip-name">Trip: --</p>

  <h2>Cost Breakdown</h2>
  <ul id="costs">
    <li class="cost">Hotel: --</li>
    <li class="cost">Food: --</li>
    <li class="cost">Travel: --</li>
  </ul>

  <div class="summary">
    <p id="total">Total: --</p>
    <p id="per-person">Per person: --</p>
    <p id="savings">Savings per person: --</p>
  </div>

  <p class="note">All amounts are in rupees.</p>

  <!-- The script is at the bottom ON PURPOSE: the page must load before JS looks for elements -->
  <script src="trip-planner.js"></script>
</body>
</html>
